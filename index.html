<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Kick off the 242KB map-data download at parse time, in parallel with the
     scripts, instead of waiting for main.js to run — speeds up the globe
     (LCP element) first paint. main.js reuses this promise. -->
<script>window.__worldFetch = fetch('data/countries-50m.json').then(function (r) { return r.json(); });</script>
<title>MapGame — Learn the World</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script defer src="vendor/d3.min.js"></script>
<script defer src="vendor/topojson-client.min.js"></script>
</head>
<body>

<!-- Permanent map/globe layer: ambient background behind the menus, the
     playable board during a game. -->
<div id="map"></div>

<!-- ===== Player selection ===== -->
<div id="screen-players" class="screen active">
  <div class="panel">
    <div class="lang-switch" id="lang-switch-players">
      <button data-lang="fr">FR</button><button data-lang="en">EN</button>
    </div>
    <h1 class="logo"><span class="logo-ico"></span>MapGame</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <h3 id="pick-title" class="section-title hidden" data-i18n="pickTitle"></h3>
    <div id="player-list" class="player-list"></div>
    <p id="cloud-players-title" class="hint hidden" data-i18n="cloudPlayers"></p>
    <div id="cloud-list" class="player-list"></div>

    <!-- PIN prompt for selecting / linking an existing player -->
    <div id="pin-panel" class="pin-panel hidden">
      <p id="pin-panel-label"></p>
      <div class="new-player">
        <input id="pin-input" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
        <button id="btn-pin-ok" class="btn primary" data-i18n="ok"></button>
        <button id="btn-pin-cancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
      <p id="pin-error" class="pin-error hidden"></p>
    </div>

    <h3 id="create-title" class="section-title" data-i18n="orCreate"></h3>
    <p class="hint" data-i18n="createHint"></p>
    <!-- Not a <form>: sandboxed embeds (artifact viewers) block form submission. -->
    <div class="new-player">
      <input id="new-player-name" type="text" maxlength="20" data-i18n-placeholder="placeholderName" autocomplete="off">
      <input id="new-player-pin" type="tel" inputmode="numeric" maxlength="4" data-i18n-placeholder="pinPlaceholder" autocomplete="off">
      <button id="btn-add-player" type="button" class="btn primary" data-i18n="addPlayer"></button>
    </div>
    <p id="player-msg" class="pin-error hidden"></p>

    <div id="reset-wrap" class="reset-wrap hidden">
      <button id="btn-reset" class="btn ghost danger small" data-i18n="resetBtn" data-icon="reset"></button>
      <span id="reset-confirm" class="hidden">
        <span data-i18n="resetConfirm"></span>
        <button id="btn-reset-yes" class="btn danger small" data-i18n="resetYes"></button>
        <button id="btn-reset-no" class="btn ghost small" data-i18n="cancel"></button>
      </span>
    </div>
  </div>
</div>

<!-- ===== Main menu ===== -->
<div id="screen-menu" class="screen">
  <div class="panel wide">
    <div class="menu-head">
      <h1 class="logo small"><span class="logo-ico"></span>MapGame</h1>
      <div class="menu-head-right">
        <div class="lang-switch map-switch" id="map-switch">
          <button data-mode="2d">2D</button><button data-mode="globe">3D</button>
        </div>
        <div class="lang-switch" id="lang-switch-menu">
          <button data-lang="fr">FR</button><button data-lang="en">EN</button>
        </div>
        <button id="btn-switch-player" class="btn ghost"><span class="switch-ico"></span><span id="menu-player-name"></span></button>
      </div>
    </div>

    <h2 data-i18n="chooseLevels"></h2>
    <p class="hint" data-i18n="levelsHint"></p>
    <div id="level-grid" class="level-grid"></div>

    <div class="menu-actions">
      <button id="btn-review" class="btn primary" data-i18n="reviewBtn" data-icon="repeat"></button>
      <button id="btn-hub" class="btn ghost" data-i18n="hubBtn" data-icon="trophy"></button>
    </div>
    <div class="menu-footer">
      <span id="online-badge" class="online-badge"></span>
    </div>
  </div>
</div>

<!-- ===== Leaderboard ===== -->
<div id="screen-leaderboard" class="screen">
  <div class="panel wide scroll">
    <div class="menu-head">
      <h2 data-i18n="leaderboardBtn"></h2>
      <button id="btn-lb-back" class="btn ghost" data-i18n="back"></button>
    </div>
    <nav class="hub-tabs">
      <button data-hub="lb" data-i18n="tabLb" data-icon="trophy"></button>
      <button data-hub="countries" data-i18n="tabCountries" data-icon="book"></button>
      <button data-hub="progress" data-i18n="tabProgress" data-icon="chart"></button>
    </nav>
    <div id="lb-tabs" class="lb-tabs"></div>
    <div id="lb-body"></div>
  </div>
</div>

<!-- ===== Country list by level ===== -->
<div id="screen-countries" class="screen">
  <div class="panel wide scroll">
    <div class="menu-head">
      <h2 data-i18n="countryListBtn"></h2>
      <button id="btn-countries-back" class="btn ghost" data-i18n="back"></button>
    </div>
    <nav class="hub-tabs">
      <button data-hub="lb" data-i18n="tabLb" data-icon="trophy"></button>
      <button data-hub="countries" data-i18n="tabCountries" data-icon="book"></button>
      <button data-hub="progress" data-i18n="tabProgress" data-icon="chart"></button>
    </nav>
    <p class="hint" data-i18n="listHint"></p>
    <div id="country-legend" class="country-legend"></div>
    <div id="country-list-body"></div>
  </div>
</div>

<!-- ===== Stats ===== -->
<div id="screen-stats" class="screen">
  <div class="panel wide scroll">
    <div class="menu-head">
      <h2><span data-i18n="progressTitle"></span><span id="stats-player-name"></span></h2>
      <button id="btn-stats-back" class="btn ghost" data-i18n="back"></button>
    </div>
    <nav class="hub-tabs">
      <button data-hub="lb" data-i18n="tabLb" data-icon="trophy"></button>
      <button data-hub="countries" data-i18n="tabCountries" data-icon="book"></button>
      <button data-hub="progress" data-i18n="tabProgress" data-icon="chart"></button>
    </nav>
    <div id="stats-summary" class="stats-summary"></div>
    <h3 data-i18n="knowledgeOverTime"></h3>
    <div id="stats-evolution" class="stats-evolution"></div>
    <h3 data-i18n="countriesToReinforce"></h3>
    <p class="hint" data-i18n="weakHint"></p>
    <div id="stats-weakest"></div>
    <h3 data-i18n="allCountries"></h3>
    <div id="stats-table"></div>
  </div>
</div>

<!-- ===== Game ===== -->
<div id="screen-game" class="screen">
  <div class="hud hud-top">
    <div class="hud-card main-card" id="main-card">
      <div class="main-card-head">
        <div>
          <div class="prompt-label" id="prompt-label"></div>
          <div class="prompt-country" id="prompt-country">—</div>
        </div>
        <div class="prompt-tier" id="prompt-tier"></div>
      </div>
      <div class="mc-mid">
        <div class="hud-counters" id="hud-counters"></div>
        <div class="hud-progress" id="hud-progress">
          <span id="hud-prog-ok"></span><span id="hud-prog-ko"></span>
        </div>
        <div class="hud-flags" id="hud-flags"></div>
      </div>
      <div class="hud-actions">
        <button id="btn-dontknow" class="btn small ghost"></button>
        <button id="btn-end" class="btn small ghost danger"></button>
      </div>
    </div>
  </div>

  <div id="zoom-hint" class="zoom-hint hidden"></div>

  <div id="points-popup" class="points-popup hidden"></div>
</div>

<!-- ===== Session summary ===== -->
<div id="screen-summary" class="screen">
  <div class="panel">
    <h2 id="summary-title"></h2>
    <div id="summary-stars" class="summary-stars hidden"></div>
    <div id="summary-body"></div>
    <div class="menu-actions summary-actions">
      <button id="btn-resume" class="btn primary big hidden"></button>
      <button id="btn-training" class="btn primary big hidden"></button>
      <button id="btn-again" class="btn primary"></button>
      <button id="btn-summary-menu" class="btn ghost"></button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
